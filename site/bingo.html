<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gran Bingo · Tenis de Mesa Curridabat</title>
<style>
:root{
  --blue:#356AD4; --blue-d:#1E4496; --navy:#0A1734; --navy2:#11265A; --navy3:#18337A;
  --red:#C8201D; --red-l:#E5413D; --white:#FFFFFF; --ink:#EAF0FC; --muted:#8FA3D1;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --heavy: "Arial Black", "Segoe UI Black", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font); color:var(--ink); overflow:hidden;
  background:radial-gradient(ellipse at 50% -10%, #23489E 0%, var(--navy2) 38%, var(--navy) 80%);
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr); height:100vh;
}
button,select,input{font-family:inherit}

/* ---------- Header ---------- */
header{display:flex;align-items:center;gap:1.6vw;padding:1.4vh 2vw .6vh}
.logo{height:12vh;width:12vh;object-fit:contain;filter:drop-shadow(0 .8vh 1.6vh rgba(0,0,0,.45));flex:none}
.titles{flex:1;min-width:0}
.titles h1{margin:0;font-family:var(--heavy);font-weight:900;font-weight:900;font-size:clamp(26px,4.6vw,96px);line-height:1;
  color:#fff;letter-spacing:.02em;text-shadow:0 .5vh 1.6vh rgba(0,0,0,.45);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.6vh 1vw .6vh 0}
.titles p{margin:.9vh 0 0;font-size:clamp(13px,1.5vw,30px);color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.stats{display:flex;gap:1vw}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:1.4vh;padding:1vh 1.4vw;text-align:center;min-width:8.5vw}
.stat small{display:block;font-size:clamp(10px,.85vw,16px);letter-spacing:.14em;color:var(--muted);font-weight:700}
.stat b{display:block;font-family:var(--heavy);font-weight:900;font-size:clamp(20px,2.8vw,56px);line-height:1.05;color:#fff}

/* ---------- Main ---------- */
main{display:grid;grid-template-columns:21fr 51fr 28fr;gap:1.6vw;padding:1vh 2vw;min-height:0}
.panel{background:rgba(6,16,40,.45);border:1px solid rgba(255,255,255,.09);border-radius:2vh;padding:1.6vh 1.2vw;min-height:0}
.panel h2{margin:0 0 1.2vh;font-size:clamp(11px,.95vw,18px);letter-spacing:.18em;color:var(--muted);text-transform:uppercase;font-weight:800}

.left{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1.2vh;padding-top:1.4vh}
.ball{position:relative;flex:none;width:min(14vw,29vh);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff 0%,#F3F6FC 42%,#C7D2EC 100%);
  box-shadow:0 2vh 5vh rgba(0,0,0,.55), inset 0 -1.2vh 3vh rgba(30,68,150,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.ball::before{content:"";position:absolute;inset:7%;border-radius:50%;border:max(4px,.7vh) solid var(--red)}
.ball .bl{font-family:var(--heavy);font-weight:900;color:var(--blue);font-size:min(3.4vw,7.5vh);line-height:1}
.ball .bn{font-family:var(--heavy);font-weight:900;color:var(--red);font-size:min(6.4vw,13.5vh);line-height:.95;letter-spacing:-.03em}
.ball.empty .bn{font-size:min(3vw,7vh);color:var(--muted)}
.ball.rolling{animation:shake .12s linear infinite}
.ball.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes shake{0%{transform:rotate(-4deg) scale(.97)}50%{transform:rotate(4deg) scale(1.02)}100%{transform:rotate(-4deg) scale(.97)}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.lastlbl{font-size:clamp(11px,.9vw,17px);letter-spacing:.16em;color:var(--muted);font-weight:800;text-transform:uppercase}
.history{flex:1;min-height:0;width:100%;overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min(5vw,10vh);row-gap:1vh;column-gap:.6vw;justify-items:center;align-content:start}
.hb{width:min(5vw,10vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#D5DDF0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 .6vh 1.4vh rgba(0,0,0,.4);
  border:max(2px,.35vh) solid var(--red)}
.hb i{font-style:normal;font-family:var(--heavy);font-weight:900;color:var(--blue);font-size:min(1.05vw,2.2vh);line-height:1}
.hb b{font-family:var(--heavy);font-weight:900;color:var(--red);font-size:min(1.9vw,4vh);line-height:1}
.hb:nth-child(n+4){opacity:.8}
.hb:nth-child(n+10){opacity:.6}

/* Board */
.center{display:flex;flex-direction:column;justify-content:center}
.board{display:grid;gap:1.1vh}
.brow{display:grid;grid-template-columns:1.3fr repeat(15,1fr);gap:.32vw;height:min(12.5vh,5vw)}
.blet{border-radius:1vh;background:var(--red);color:#fff;font-family:var(--heavy);font-weight:900;display:flex;align-items:center;justify-content:center;
  font-size:min(3vw,7.5vh);box-shadow:inset 0 -.6vh 0 rgba(0,0,0,.2)}
.cell{border-radius:.9vh;background:rgba(53,106,212,.14);border:1px solid rgba(53,106,212,.35);color:rgba(234,240,252,.42);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:min(1.75vw,4.2vh);cursor:pointer;
  transition:background .25s,color .25s,transform .25s;user-select:none}
.cell:hover{border-color:var(--muted)}
.cell.on{background:var(--blue);border-color:#6E95E8;color:#fff;box-shadow:inset 0 -.5vh 0 rgba(0,0,0,.18)}
.cell.last{background:#fff;color:var(--red);border-color:#fff;transform:scale(1.12);box-shadow:0 0 0 .4vh var(--red),0 0 2.4vh rgba(255,255,255,.55);z-index:1}
.boardfoot{display:flex;justify-content:space-between;margin-top:1.6vh;font-size:clamp(11px,.9vw,17px);color:var(--muted);font-weight:700;letter-spacing:.06em}

/* Right column */
.right{display:flex;flex-direction:column;gap:1.6vh;min-height:0}
.pat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.patname{font-family:var(--heavy);font-weight:900;font-size:clamp(18px,1.9vw,40px);color:#fff;text-align:center;line-height:1.1;margin-bottom:.4vh}
.patdesc{font-size:clamp(11px,.85vw,16px);color:var(--muted);margin-bottom:1vh;text-align:center;min-height:1.2em}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5vh;width:min(100%,23vh)}
.pgrid .ph{text-align:center;font-family:var(--heavy);font-weight:900;color:var(--red);font-size:min(1.4vw,3vh);line-height:1.2}
.pgrid .pc{aspect-ratio:1;border-radius:.6vh;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;transition:background .3s}
.pgrid .pc.f{background:var(--red);border-color:var(--red-l)}
.pgrid .pc.f::after{content:"";width:42%;aspect-ratio:1;border-radius:50%;background:#fff}
.pgrid .pc.free::after{content:"★";color:#fff;font-size:min(1.3vw,2.6vh);width:auto;background:none}
.pgrid .pc.free:not(.f)::after{color:var(--muted)}

.prize{flex:1;display:flex;flex-direction:column;min-height:0}
.prize .pimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%);border-radius:1.4vh}
.prize .pimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:1.2vh;box-shadow:0 1vh 3vh rgba(0,0,0,.45)}
.prize .pimg .gift{font-size:min(7vw,14vh)}
.prize .pname{margin-top:1.2vh;font-family:var(--heavy);font-weight:900;font-size:clamp(16px,1.6vw,34px);line-height:1.15;color:#fff;text-align:center}
.hidden{display:none!important}

/* ---------- Controls ---------- */
footer{display:flex;flex-wrap:nowrap;gap:.5vw;min-width:0;align-items:center;padding:1vh 2vw 1.6vh}
.btn{border:0;border-radius:1.1vh;padding:1.2vh .9vw;font-size:clamp(12px,.95vw,18px);font-weight:800;cursor:pointer;
  background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.red{background:var(--red);border-color:var(--red-l)}
.btn.red:hover{background:var(--red-l)}
.btn.blue{background:var(--blue);border-color:#6E95E8}
.btn.big{font-size:clamp(14px,1.25vw,24px);padding:1.4vh 1.4vw}
.btn.white{background:#fff;color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
footer select{min-width:0;max-width:13vw!important;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:1.1vh;padding:1.1vh .8vw;font-size:clamp(12px,.9vw,17px);font-weight:700;max-width:17vw}
footer select option{color:#000}
.manual{display:flex;align-items:center;gap:.5vw;background:rgba(200,32,29,.18);border:1px solid rgba(229,65,61,.5);border-radius:1.3vh;padding:.6vh .6vw}
#numIn{width:5.2vw;min-width:64px;font-family:var(--heavy);font-weight:900;font-size:clamp(20px,1.9vw,38px);text-align:center;border-radius:1vh;border:2px solid #fff;background:#fff;color:var(--red);padding:.4vh .3vw}
#numIn.bad{border-color:#FFB020;animation:shake .12s linear 3}
.preview{font-family:var(--heavy);font-weight:900;color:#fff;font-size:clamp(16px,1.5vw,30px);min-width:3.6vw;text-align:center}
body.manualMode #bDraw{display:none}
body:not(.manualMode) #manualBox{display:none}
footer label{font-size:clamp(10px,.75vw,14px);color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;gap:.3vh}
.spacer{flex:1}
body.present footer{display:none}
#showCtl{position:fixed;right:1vw;bottom:1vh;opacity:.15;display:none}
#showCtl:hover{opacity:1}
body.present #showCtl{display:block}
kbd{font-size:.8em;opacity:.6;margin-left:.4em;font-family:inherit;display:none}
@media (min-width:1500px){#bDraw kbd{display:inline}}

/* ---------- Overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(4,10,26,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:3vh 3vw}
.card{background:linear-gradient(180deg,#14306F,#0C1D47);border:1px solid rgba(255,255,255,.15);border-radius:2.2vh;box-shadow:0 3vh 8vh rgba(0,0,0,.6);max-height:100%;overflow:auto}
.bingoCard{padding:3vh 3vw;text-align:center;width:min(780px,92vw)}
.bingoCard h1{margin:0;font-family:var(--heavy);font-weight:900;font-size:clamp(40px,5vw,96px);color:#fff;text-shadow:0 .6vh 0 var(--red);line-height:1}
.bingoCard .sub{color:var(--muted);font-weight:700;margin:1.2vh 0 2vh;font-size:clamp(14px,1.2vw,22px)}
.bingoCard img{max-height:32vh;max-width:100%;border-radius:1.4vh;box-shadow:0 1vh 3vh rgba(0,0,0,.5)}
.bingoCard .pn{font-family:var(--heavy);font-weight:900;font-size:clamp(20px,2.2vw,42px);margin:1.4vh 0 2vh;color:#fff}
.bingoCard input{width:100%;padding:1.4vh 1vw;border-radius:1vh;border:2px solid var(--blue);background:#fff;color:#111;font-size:clamp(16px,1.3vw,24px);margin-bottom:2vh;text-align:center}
.row-btns{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
.winner{font-family:var(--heavy);font-weight:900;font-size:clamp(28px,3.4vw,64px);color:#fff;margin:1vh 0}

.gallery{padding:3vh 2.4vw;width:min(1500px,96vw)}
.gallery h2{margin:0 0 2vh;font-family:var(--heavy);font-weight:900;font-size:clamp(24px,2.6vw,48px);color:#fff;text-align:center}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,15vw),1fr));gap:1.6vh 1.2vw}
.gi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:1.4vh;padding:1vh;text-align:center;position:relative}
.gi .im{height:min(16vh,12vw);display:flex;align-items:center;justify-content:center}
.gi img{max-width:100%;max-height:100%;object-fit:contain;border-radius:.8vh}
.gi .gift{font-size:6vh}
.gi .nm{font-weight:800;font-size:clamp(12px,.95vw,18px);margin-top:.8vh;color:#fff;line-height:1.2}
.gi .qty{position:absolute;top:.6vh;left:.6vh;background:var(--red);color:#fff;font-weight:900;border-radius:99px;padding:.2vh .8vh;font-size:clamp(11px,.85vw,16px)}
.gi.done{opacity:.4;filter:grayscale(1)}
.gi.done::after{content:"ENTREGADO";position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);background:var(--red);color:#fff;font-weight:900;padding:.4vh 1vw;border-radius:.6vh;letter-spacing:.1em;filter:none}
.gi.cur{outline:.4vh solid #fff}

/* Settings */
.settings{width:min(1100px,96vw);height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden}
.stabs{display:flex;gap:.4vw;padding:1.6vh 1.6vw 0;border-bottom:1px solid rgba(255,255,255,.12);align-items:flex-end}
.stab{padding:1.1vh 1.2vw;border-radius:1vh 1vh 0 0;cursor:pointer;font-weight:800;color:var(--muted);background:none;border:0;font-size:15px}
.stab.on{background:rgba(255,255,255,.1);color:#fff}
.sbody{flex:1;overflow:auto;padding:2vh 1.6vw;font-size:15px}
.sfoot{padding:1.4vh 1.6vw;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:flex-end;gap:.6vw}
.prow{display:grid;grid-template-columns:64px 1fr 80px 150px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.prow .th{width:64px;height:64px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;font-size:28px;position:relative}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow .th:hover::after{content:"Cambiar";position:absolute;inset:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sbody input[type=text],.sbody input[type=number]{width:100%;padding:9px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:15px}
.mini{padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15);cursor:pointer;font-weight:700;font-size:13px}
.mini:hover{background:rgba(255,255,255,.2)}
.mini.red{background:var(--red)}
.won{font-size:13px;color:var(--muted)}
.won b{color:#fff}
.patlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:24px}
.pl{background:rgba(255,255,255,.06);border-radius:10px;padding:8px;text-align:center;font-size:13px;font-weight:700;position:relative}
.pl .pgrid{width:100%;gap:3px;margin-bottom:6px}
.pl .pgrid .pc.f::after{width:38%}
.pl .pgrid .pc.free::after,.editor .pc.free::after{font-size:11px;line-height:1}
.pgrid .pc{overflow:hidden}
.pl .del{position:absolute;top:4px;right:4px;padding:2px 7px;font-size:11px}
.editor{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start;background:rgba(255,255,255,.05);padding:16px;border-radius:12px}
.editor .pgrid{width:220px}
.editor .pc{cursor:pointer}
.field{margin-bottom:16px}
.field>span{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.wtable{width:100%;border-collapse:collapse}
.wtable th,.wtable td{text-align:left;padding:8px;border-bottom:1px solid rgba(255,255,255,.08)}
.wtable th{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.help{color:var(--muted);font-size:13px;line-height:1.5}
.confirmCard{padding:3vh 2.4vw;width:min(480px,92vw);text-align:center;font-size:18px}
.confirmCard p{margin:0 0 2.4vh;line-height:1.4}


/* ================= MODO CLARO (proyección en salón iluminado) ================= */
body.light{--ink:#0B1A3A;--muted:#4A5A80;--line:#C9D3EA;--soft:#EEF2F9;--navy-t:#0B1A3A;
  background:#FFFFFF;color:var(--ink)}
body.light .titles h1{color:var(--navy-t);text-shadow:none}
body.light .titles p{color:var(--red)}
body.light .logo{filter:none}
body.light .stat{background:var(--soft);border:2px solid var(--line)}
body.light .stat small{color:var(--muted)}
body.light .stat b{color:var(--navy-t)}
body.light .panel{background:var(--soft);border:2px solid var(--line)}
body.light .panel h2,body.light .lastlbl,body.light .boardfoot{color:var(--muted)}
body.light .ball{background:#fff;box-shadow:0 0 0 max(3px,.45vh) var(--navy-t),0 1.2vh 3vh rgba(11,26,58,.25)}
body.light .ball .bl{color:var(--navy-t)}
body.light .ball.empty .bn{color:var(--muted)}
body.light .hb{background:#fff;box-shadow:0 .4vh 1vh rgba(11,26,58,.2)}
body.light .hb i{color:var(--navy-t)}
body.light .blet{background:var(--navy-t)}
body.light .cell{background:#fff;border:2px solid var(--line);color:#6A789C}
body.light .cell:hover{border-color:var(--muted)}
body.light .cell.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:inset 0 -.5vh 0 rgba(0,0,0,.2)}
body.light .cell.last{background:var(--navy-t);border-color:var(--navy-t);color:#fff;box-shadow:0 0 0 .45vh var(--red),0 .8vh 2vh rgba(11,26,58,.35)}
body.light .patname,body.light .prize .pname{color:var(--navy-t)}
body.light .patdesc{color:var(--muted)}
body.light .pgrid .ph{color:var(--navy-t)}
body.light .pgrid .pc{background:#fff;border:2px solid var(--line)}
body.light .pgrid .pc.f{background:var(--red);border-color:var(--red)}
body.light .pgrid .pc.free:not(.f)::after{color:var(--muted)}
body.light .prize .pimg{background:none}
body.light .prize .pimg img{box-shadow:0 .6vh 1.8vh rgba(11,26,58,.25)}
body.light .btn{background:#fff;color:var(--navy-t);border:2px solid var(--line)}
body.light .btn:hover{background:var(--soft)}
body.light .btn.red{background:var(--red);border-color:var(--red);color:#fff}
body.light .btn.blue{background:var(--navy-t);border-color:var(--navy-t);color:#fff}
body.light .btn.white{background:#fff;color:var(--red);border-color:var(--red)}
body.light footer select{background:#fff;color:var(--navy-t);border:2px solid var(--line)}
body.light footer label{color:var(--muted)}
body.light .manual{background:#FBE9E9;border:2px solid #EBB3B2}
body.light #numIn{border-color:var(--red)}
body.light .preview{color:var(--navy-t)}
body.light .ov{background:rgba(11,26,58,.55)}
body.light .card{background:#fff;border:2px solid var(--line);color:var(--ink)}
body.light .bingoCard h1{color:var(--red);text-shadow:none}
body.light .bingoCard .sub{color:var(--muted)}
body.light .bingoCard .pn,body.light .winner,body.light .gallery h2{color:var(--navy-t)}
body.light .gi{background:var(--soft);border:2px solid var(--line)}
body.light .gi .nm{color:var(--navy-t)}
body.light .gi.cur{outline-color:var(--red)}
body.light .stabs,body.light .sfoot{border-color:var(--line)}
body.light .stab{color:var(--muted)}
body.light .stab.on{background:var(--soft);color:var(--navy-t)}
body.light .sbody input[type=text],body.light .sbody input[type=number]{background:#fff;color:var(--navy-t);border:2px solid var(--line)}
body.light .mini{background:var(--soft);color:var(--navy-t);border:1px solid var(--line)}
body.light .mini.red{background:var(--red);color:#fff;border-color:var(--red)}
body.light .won,body.light .help,body.light .field>span,body.light .wtable th{color:var(--muted)}
body.light .won b{color:var(--navy-t)}
body.light .prow,body.light .wtable th,body.light .wtable td{border-color:var(--line)}
body.light .prow .th,body.light .pl,body.light .editor{background:var(--soft)}
body.light #toast{background:var(--navy-t);color:#fff}

#toast{position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);background:#fff;color:var(--navy);padding:1.2vh 1.6vw;border-radius:1vh;font-weight:800;box-shadow:0 1vh 3vh rgba(0,0,0,.4);z-index:80;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
.confetti{position:fixed;top:-3vh;width:1.1vh;height:1.8vh;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<header>
  <img class="logo" id="logo" alt="Logo">
  <div class="titles"><h1 id="title"></h1><p id="subtitle"></p></div>
  <div class="stats">
    <div class="stat"><small>JUEGO</small><b id="gameNo">1</b></div>
    <div class="stat"><small>BOLAS</small><b id="count">0</b></div>
  </div>
</header>

<main>
  <section class="panel left">
    <div class="ball empty" id="ball"><span class="bl" id="ballL"></span><span class="bn" id="ballN">¡Listos!</span></div>
    <div class="lastlbl">Anteriores</div>
    <div class="history" id="history"></div>
  </section>

  <section class="panel center">
    <div class="board" id="board"></div>
    <div class="boardfoot"><span id="remain"></span><span>Tenis de Mesa Curridabat</span></div>
  </section>

  <section class="right">
    <div class="panel pat">
      <h2>Figura a jugar</h2>
      <div class="patname" id="patName"></div>
      <div class="patdesc" id="patDesc"></div>
      <div class="pgrid" id="patGrid"></div>
    </div>
    <div class="panel prize" id="prizePanel">
      <h2>Premio en juego</h2>
      <div class="pimg" id="prizeImg"></div>
      <div class="pname" id="prizeName"></div>
    </div>
  </section>
</main>

<footer>
  <div class="manual" id="manualBox">
    <input id="numIn" type="text" inputmode="numeric" maxlength="2" placeholder="Nº" autocomplete="off" aria-label="Número de la tómbola">
    <span class="preview" id="numPrev"></span>
    <button class="btn red big" id="bMark">✔ Marcar <kbd>Enter</kbd></button>
  </div>
  <button class="btn red big" id="bDraw">🎱 Sacar bola <kbd>Espacio</kbd></button>
  <button class="btn" id="bUndo" title="Atajo: tecla Z">↩ Deshacer <kbd>Z</kbd></button>
  <button class="btn" id="bRepeat" title="Atajo: tecla R">🔊 Repetir <kbd>R</kbd></button>
  <button class="btn white big" id="bBingo" title="Atajo: tecla B">¡BINGO! <kbd>B</kbd></button>
  <button class="btn blue" id="bNew" title="Atajo: tecla N">Nueva partida <kbd>N</kbd></button>
  <label>Figura<select id="selPattern"></select></label>
  <label>Premio<select id="selPrize"></select></label>
  <span class="spacer"></span>
  <button class="btn" id="bGallery" title="Atajo: tecla P">🎁 Premios</button>
  <button class="btn" id="bSettings" title="Configuración: premios, figuras, logo">⚙</button>
  <button class="btn" id="bTheme" title="Cambiar modo claro / oscuro (tecla T)">🌙</button>
  <button class="btn" id="bFull" title="Pantalla completa (tecla F)">⛶ <kbd>F</kbd></button>
  <button class="btn" id="bHide" title="Ocultar controles (tecla C)">👁 <kbd>C</kbd></button>
</footer>
<button class="btn" id="showCtl">Mostrar controles</button>
<input type="file" id="fileIn" accept="image/*" class="hidden">
<input type="file" id="jsonIn" accept="application/json,.json" class="hidden">
<div id="ovRoot"></div>
<div id="toast"></div>

  ['licuadora','Licuadora con jarra de vidrio',1], ['coffee','Coffee maker',1], ['olla','Olla de presión',1],
  ['plancha','Plancha',1], ['tetera','Tetera eléctrica de vidrio',1], ['cafetera','Cafetera eléctrica',1],
  ['vino','Botella de vino',1], ['licor','Licor',1], ['reloj','Reloj de pared',1], ['masaje','Certificado de masaje',1],
];
function defaults() {
  const prizes = DEFAULT_PRIZES.map(([k, name, qty]) => ({id:k, name, qty, won:0, img:'builtin:' + k}));
  return {
    title:'¡Gran Bingo!', subtitle:'Tenis de Mesa Curridabat', logo:null, voice:false, mode:'manual', theme:'light',
    prizes, customPatterns:[], winners:[],
    game:{n:1, patternId:'linea', prizeId:prizes[0].id, called:[]}
  };
}
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.game) S = defaults();

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) { toast('⚠ No se pudo guardar (memoria del navegador llena). Use fotos más livianas.'); return false; }
}
const allPatterns = () => [...BUILTIN, ...S.customPatterns];
const patById = id => allPatterns().find(p => p.id === id) || BUILTIN[0];
const prizeById = id => S.prizes.find(p => p.id === id);
const imgSrc = p => !p || !p.img ? null : p.img.startsWith('builtin:') ? ASSETS[p.img.slice(8)] : p.img;
const left = p => Math.max(0, p.qty - p.won);

/* ---------- UI principal ---------- */
function buildBoard() {
  const b = $('#board'); b.innerHTML = '';
  for (let r = 0; r < 5; r++) {
    const row = document.createElement('div'); row.className = 'brow';
    row.innerHTML = `<div class="blet">${LET[r]}</div>` +
      Array.from({length:15}, (_, i) => { const n = r * 15 + i + 1; return `<div class="cell" data-n="${n}">${n}</div>`; }).join('');
    b.appendChild(row);
  }
  b.addEventListener('click', e => {
    const c = e.target.closest('.cell'); if (!c) return;
    const n = +c.dataset.n;
    if (S.game.called.includes(n)) {
      confirmBox(`¿Quitar el <b>${letterOf(n)}-${n}</b> de los números jugados?`, () => {
        S.game.called = S.game.called.filter(x => x !== n); save(); render();
      });
    } else callNumber(n);   // marcar manualmente (tómbola física)
  });
}

function patGridHTML(cells, header = true) {
  let h = header ? LET.split('').map(l => `<div class="ph">${l}</div>`).join('') : '';
  cells.forEach((on, i) => { h += `<div class="pc${on ? ' f' : ''}${i === 12 ? ' free' : ''}" data-i="${i}"></div>`; });
  return h;
}
let patTimer = null, patFrame = 0;
function renderPattern() {
  const p = patById(S.game.patternId);
  $('#patName').textContent = p.name;
  $('#patDesc').textContent = p.desc || '';
  clearInterval(patTimer); patFrame = 0;
  const frames = p.variants || [p.cells];
  $('#patGrid').innerHTML = patGridHTML(frames[0]);
  if (frames.length > 1) patTimer = setInterval(() => {
    patFrame = (patFrame + 1) % frames.length;
    $('#patGrid').innerHTML = patGridHTML(frames[patFrame]);
  }, 1100);
}

function showBall(n) {
  const ball = $('#ball');
  if (!n) { ball.classList.add('empty'); $('#ballL').textContent = ''; $('#ballN').textContent = '¡Listos!'; return; }
  ball.classList.remove('empty'); $('#ballL').textContent = letterOf(n); $('#ballN').textContent = n;
}

function render() {
  const g = S.game, called = g.called, last = called[called.length - 1];
  $('#title').textContent = S.title; $('#subtitle').textContent = S.subtitle;
  $('#logo').src = S.logo || ASSETS.logo;
  $('#gameNo').textContent = g.n;
  $('#count').textContent = called.length;
  $('#remain').textContent = `Quedan ${75 - called.length} de 75`;
  if (!drawing) showBall(last);
  $('#history').innerHTML = called.slice(0, -1).slice(-historyCap()).reverse()
    .map(n => `<div class="hb"><i>${letterOf(n)}</i><b>${n}</b></div>`).join('');
  const set = new Set(called);
  document.querySelectorAll('.cell').forEach(c => {
    const n = +c.dataset.n;
    c.classList.toggle('on', set.has(n)); c.classList.toggle('last', n === last);
  });
  // premio
  const pr = prizeById(g.prizeId);
  $('#prizePanel').classList.toggle('hidden', !pr);
  if (pr) {
    const src = imgSrc(pr);
    $('#prizeImg').innerHTML = src ? `<img src="${src}" alt="">` : `<span class="gift">🎁</span>`;
    $('#prizeName').textContent = pr.name;
  }
  // selects
  $('#selPattern').innerHTML = allPatterns().map(p => `<option value="${p.id}"${p.id === g.patternId ? ' selected' : ''}>${esc(p.name)}</option>`).join('');
  $('#selPrize').innerHTML = `<option value="">— Sin premio —</option>` + S.prizes.map(p =>
    `<option value="${p.id}"${p.id === g.prizeId ? ' selected' : ''}${left(p) === 0 && p.id !== g.prizeId ? ' disabled' : ''}>${esc(p.name)} (${left(p) ? 'quedan ' + left(p) : 'entregado'})</option>`).join('');
  $('#bUndo').disabled = !called.length;
  $('#bDraw').disabled = called.length >= 75;
  document.body.classList.toggle('manualMode', S.mode !== 'auto');
  document.body.classList.toggle('light', S.theme !== 'dark');
  $('#bTheme').textContent = S.theme === 'dark' ? '☀' : '🌙';
  $('#bRepeat').classList.toggle('hidden', !S.voice);
}

function historyCap() {
  const h = $('#history'); if (!h) return 6;
  const item = Math.min(innerWidth * .05, innerHeight * .10), gap = innerHeight * .010;
  const rows = Math.max(1, Math.floor((h.clientHeight + gap) / (item + gap)));
  return rows * 3;
}
addEventListener('resize', () => render());

/* ---------- Juego ---------- */
let drawing = false;
const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const remaining = () => { const s = new Set(S.game.called); return Array.from({length:75}, (_, i) => i + 1).filter(n => !s.has(n)); };

function draw() {
  if (drawing || anyOverlay()) return;
  const rem = remaining();
  if (!rem.length) { toast('Ya salieron las 75 bolas'); return; }
  drawing = true;
  const pick = rem[rnd(rem.length)];
  const ball = $('#ball'); ball.classList.add('rolling');
  const t0 = performance.now();
  (function tick() {
    showBall(rem[rnd(rem.length)]);
    if (performance.now() - t0 < 950) setTimeout(tick, 65);
    else {
      ball.classList.remove('rolling'); drawing = false;
      callNumber(pick);
    }
  })();
}
function callNumber(n) {
  if (S.game.called.includes(n)) return;
  S.game.called.push(n); save(); render();
  const ball = $('#ball'); ball.classList.remove('pop'); void ball.offsetWidth; ball.classList.add('pop');
  announce(n);
}
function markTyped() {
  const inp = $('#numIn'), n = parseInt(inp.value, 10);
  const bad = msg => { toast(msg); inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad'); inp.select(); };
  if (!inp.value) return inp.focus();
  if (!(n >= 1 && n <= 75)) return bad('Escriba un número del 1 al 75');
  if (S.game.called.includes(n)) return bad(`El ${letterOf(n)}-${n} ya está marcado`);
  callNumber(n); inp.value = ''; $('#numPrev').textContent = ''; inp.blur();
}
function undo() {
  if (!S.game.called.length) return;
  const n = S.game.called.pop(); save(); render(); toast(`Se quitó el ${letterOf(n)}-${n}`);
}
function announce(n) {
  if (!S.voice || !n || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(`${SAY[letterOf(n)]}... ${n}`);
    const v = speechSynthesis.getVoices().find(v => /^es/i.test(v.lang));
    if (v) u.voice = v; u.lang = v ? v.lang : 'es-ES'; u.rate = .9;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const nextPrizeId = () => (S.prizes.find(p => left(p) > 0) || {}).id || '';
function newGame(force) {
  const go = () => {
    S.game = {n:S.game.n + 1, patternId:S.game.patternId, prizeId:nextPrizeId(), called:[]};
    save(); closeOverlay(); render();
  };
  if (S.game.called.length && !force) confirmBox('¿Empezar una <b>nueva partida</b>? Se limpiarán los números jugados.', go);
  else go();
}

/* ---------- Overlays ---------- */
const anyOverlay = () => !!$('#ovRoot').firstChild;
function openOverlay(html, cls = '') {
  $('#ovRoot').innerHTML = `<div class="ov"><div class="card ${cls}">${html}</div></div>`;
  $('#ovRoot .ov').addEventListener('mousedown', e => { if (e.target.classList.contains('ov') && !cls.includes('bingoCard')) closeOverlay(); });
  return $('#ovRoot .card');
}
function closeOverlay() { $('#ovRoot').innerHTML = ''; }
function confirmBox(msg, onYes, onNo) {
  const c = openOverlay(`<p>${msg}</p><div class="row-btns"><button class="btn" data-a="no">Cancelar</button><button class="btn red" data-a="yes">Sí, continuar</button></div>`, 'confirmCard');
  c.addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a) return;
    closeOverlay(); if (a === 'yes') onYes(); else if (onNo) onNo();
  });
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }

function bingo() {
  if (anyOverlay()) return;
  const g = S.game, pr = prizeById(g.prizeId), pat = patById(g.patternId), src = imgSrc(pr);
  const c = openOverlay(`
    <h1>¡BINGO!</h1>
    <div class="sub">Juego ${g.n} · ${esc(pat.name)} · ${g.called.length} bolas jugadas</div>
    ${pr ? `${src ? `<img src="${src}" alt="">` : '<div style="font-size:12vh">🎁</div>'}<div class="pn">${esc(pr.name)}</div>` : ''}
    <input id="wName" type="text" placeholder="Nombre del ganador (opcional)" autocomplete="off">
    <div class="row-btns">
      <button class="btn" data-a="cancel">Volver</button>
      <button class="btn" data-a="false">Bingo falso – seguir jugando</button>
      <button class="btn red big" data-a="ok">✔ Confirmar ganador</button>
    </div>`, 'bingoCard');
  confetti(60);
  c.addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'cancel') return closeOverlay();
    if (a === 'false') { closeOverlay(); toast('Seguimos jugando'); return; }
    const name = $('#wName').value.trim() || 'Ganador';
    S.winners.push({game:g.n, pattern:pat.name, prize:pr ? pr.name : '—', name, balls:g.called.length, time:new Date().toLocaleTimeString('es-CR', {hour:'2-digit', minute:'2-digit'})});
    if (pr) pr.won = Math.min(pr.qty, pr.won + 1);
    save(); render(); confetti(160);
    c.innerHTML = `
      <h1>¡Felicidades!</h1>
      <div class="winner">${esc(name)}</div>
      ${pr ? `${src ? `<img src="${src}" alt="">` : ''}<div class="pn">${esc(pr.name)}</div>` : '<div style="height:2vh"></div>'}
      <div class="row-btns">
        <button class="btn" data-b="close">Cerrar</button>
        <button class="btn blue" data-b="more">Otro ganador en esta partida</button>
        <button class="btn red big" data-b="new">▶ Nueva partida</button>
      </div>`;
    c.addEventListener('click', ev => {
      const b = ev.target.dataset.b; if (!b) return;
      if (b === 'close') closeOverlay();
      if (b === 'more') { closeOverlay(); bingo(); }
      if (b === 'new') newGame(true);
    });
  });
  $('#wName').addEventListener('keydown', e => { if (e.key === 'Enter') c.querySelector('[data-a=ok]').click(); });
  setTimeout(() => $('#wName') && $('#wName').focus(), 50);
}

function confetti(n) {
  const colors = ['#C8201D', '#356AD4', '#FFFFFF', '#E5413D', '#8FB0F0'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = colors[i % colors.length];
    d.style.animationDuration = (2.2 + Math.random() * 2.2) + 's'; d.style.animationDelay = Math.random() * .6 + 's';
    d.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(d); setTimeout(() => d.remove(), 5200);
  }
}

/* ---------- Fotos ---------- */
function pickImage(cb) {
  const inp = $('#fileIn'); inp.value = '';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 700, k = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, cv.width, cv.height);
        const png = /png|svg|webp/i.test(f.type);
        cb(png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', .85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}

function tabPrizes() {
  const b = $('#sbody');
  b.innerHTML = `<p class="help">Toque la foto para cambiarla. El orden de la lista es el orden en que se asignan los premios a cada partida nueva.</p>` +
    S.prizes.map((p, i) => {
      const src = imgSrc(p);
      return `<div class="prow" data-i="${i}">
        <div class="th" data-act="img">${src ? `<img src="${src}" alt="">` : '🎁'}</div>
        <input type="text" data-f="name" value="${esc(p.name)}">
        <input type="number" min="1" data-f="qty" value="${p.qty}" title="Cantidad">
        <span class="won">Entregados: <b>${p.won}</b> ${p.won ? '<button class="mini" data-act="unwon" title="Restar uno">−1</button>' : ''}</span>
        <span style="display:flex;gap:4px"><button class="mini" data-act="up">↑</button><button class="mini" data-act="down">↓</button>
        ${p.img ? '<button class="mini" data-act="noimg" title="Quitar foto">Sin foto</button>' : ''}<button class="mini red" data-act="del">✕</button></span>
      </div>`;
    }).join('') +
    `<div style="margin-top:14px"><button class="mini" data-act="add" style="padding:10px 16px">＋ Agregar premio</button></div>`;
  b.oninput = e => {
    const row = e.target.closest('.prow'); if (!row) return;
    const p = S.prizes[+row.dataset.i], f = e.target.dataset.f;
    if (f === 'name') p.name = e.target.value;
    if (f === 'qty') p.qty = Math.max(1, parseInt(e.target.value) || 1);
    save();
  };
  b.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
    if (act === 'add') { S.prizes.push({id:'p' + Date.now(), name:'Nuevo premio', qty:1, won:0, img:null}); save(); tabPrizes(); b.scrollTop = b.scrollHeight; return; }
    const i = +e.target.closest('.prow').dataset.i, p = S.prizes[i];
    if (act === 'img') pickImage(url => { const old = p.img; p.img = url; if (!save()) p.img = old; tabPrizes(); });
    if (act === 'noimg') { p.img = null; save(); tabPrizes(); }
    if (act === 'unwon') { p.won = Math.max(0, p.won - 1); save(); tabPrizes(); }
    if (act === 'up' && i > 0) { [S.prizes[i - 1], S.prizes[i]] = [S.prizes[i], S.prizes[i - 1]]; save(); tabPrizes(); }
    if (act === 'down' && i < S.prizes.length - 1) { [S.prizes[i + 1], S.prizes[i]] = [S.prizes[i], S.prizes[i + 1]]; save(); tabPrizes(); }
    if (act === 'del') confirmBox(`¿Eliminar el premio <b>${esc(p.name)}</b>?`, () => {
      S.prizes.splice(i, 1); if (S.game.prizeId === p.id) S.game.prizeId = nextPrizeId(); save(); settings('premios');
    }, () => settings('premios'));
  };
}

  $('#evSub').oninput = e => { S.subtitle = e.target.value; save(); render(); };
  $('#evVoice').onchange = e => { S.voice = e.target.checked; save(); render(); };
  b.querySelectorAll('[name=evMode]').forEach(r => r.onchange = () => { S.mode = r.value; save(); render(); });
  $('#evLogo').onclick = () => pickImage(url => { S.logo = url; save(); render(); tabEvent(); });
  if ($('#evLogoReset')) $('#evLogoReset').onclick = () => { S.logo = null; save(); render(); tabEvent(); };
  $('#evExport').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'}));
    a.download = 'bingo-respaldo.json'; document.body.appendChild(a); a.click(); a.remove();
  };
  $('#evImport').onclick = () => {
    const inp = $('#jsonIn'); inp.value = '';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      f.text().then(t => { const d = JSON.parse(t); if (!d.game || !d.prizes) throw 0; S = d; save(); render(); renderPattern(); settings('evento'); toast('Respaldo cargado'); })
        .catch(() => toast('Ese archivo no es un respaldo válido'));
    };
    inp.click();
  };
  $('#evResetGames').onclick = () => confirmBox('¿Reiniciar juegos? Se borran ganadores y entregas, y se vuelve al Juego 1.', () => {
    S.prizes.forEach(p => p.won = 0); S.winners = [];
    S.game = {n:1, patternId:S.game.patternId, prizeId:nextPrizeId(), called:[]}; save(); render(); settings('evento');
  }, () => settings('evento'));
  $('#evResetAll').onclick = () => confirmBox('¿Borrar <b>todo</b>? Se pierden fotos cambiadas, figuras propias y ganadores.', () => {
    S = defaults(); save(); render(); renderPattern(); settings('evento');
  }, () => settings('evento'));
}

function tabWinners() {
  const b = $('#sbody');
  b.innerHTML = S.winners.length ? `<table class="wtable"><tr><th>Juego</th><th>Hora</th><th>Ganador</th><th>Figura</th><th>Premio</th><th>Bolas</th><th></th></tr>
    ${S.winners.map((w, i) => `<tr><td>${w.game}</td><td>${esc(w.time)}</td><td><b>${esc(w.name)}</b></td><td>${esc(w.pattern)}</td><td>${esc(w.prize)}</td><td>${w.balls}</td>
      <td><button class="mini" data-w="${i}">✕</button></td></tr>`).join('')}</table>
    <p class="help">Quitar a un ganador de esta lista no cambia los premios entregados (ajústelos en la pestaña Premios).</p>`
    : `<p class="help">Aún no hay ganadores. Se registran al presionar ¡BINGO! y confirmar.</p>`;
  b.querySelectorAll('[data-w]').forEach(x => x.onclick = () => { S.winners.splice(+x.dataset.w, 1); save(); tabWinners(); });
}

/* ---------- Eventos ---------- */
function fullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => toast('Pantalla completa no disponible'));
  } catch (e) { toast('Pantalla completa no disponible'); }
}
function toggleControls() { document.body.classList.toggle('present'); }

$('#bDraw').onclick = draw;
$('#bMark').onclick = markTyped;
const toggleTheme = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); render(); };
$('#bTheme').onclick = toggleTheme;
$('#numIn').addEventListener('input', e => {
  const v = e.target.value.replace(/\D/g, '').slice(0, 2); e.target.value = v;
  const n = parseInt(v, 10);
  $('#numPrev').textContent = n >= 1 && n <= 75 ? `${letterOf(n)}-${n}` : '';
});
$('#numIn').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); markTyped(); }
  if (e.key === 'Escape') { e.target.value = ''; $('#numPrev').textContent = ''; e.target.blur(); }
});
$('#bUndo').onclick = undo;
$('#bRepeat').onclick = () => announce(S.game.called[S.game.called.length - 1]);
$('#bBingo').onclick = bingo;
$('#bNew').onclick = () => newGame(false);
$('#bGallery').onclick = gallery;
$('#bSettings').onclick = () => settings();
$('#bFull').onclick = fullscreen;
$('#bHide').onclick = toggleControls;
$('#showCtl').onclick = toggleControls;
$('#selPattern').onchange = e => { S.game.patternId = e.target.value; save(); renderPattern(); e.target.blur(); };
$('#selPrize').onchange = e => { S.game.prizeId = e.target.value; save(); render(); e.target.blur(); };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (anyOverlay()) { closeOverlay(); render(); } return; }
  if (anyOverlay() || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (S.mode !== 'auto' && /^[0-9]$/.test(e.key)) { e.preventDefault(); const inp = $('#numIn'); inp.focus(); inp.value = (inp.value + e.key).slice(-2); inp.dispatchEvent(new Event('input')); return; }
  if (k === ' ' || k === 'enter') { e.preventDefault(); if (S.mode === 'auto') draw(); else $('#numIn').focus(); }
  else if (k === 'z' || k === 'backspace') undo();
  else if (k === 'r') announce(S.game.called[S.game.called.length - 1]);
  else if (k === 'b') bingo();
  else if (k === 'n') newGame(false);
  else if (k === 'f') fullscreen();
  else if (k === 'c') toggleControls();
  else if (k === 'p') gallery();
  else if (k === 't') toggleTheme();
});
// las voces cargan de forma asíncrona en algunos navegadores
if ('speechSynthesis' in window) speechSynthesis.getVoices();

buildBoard(); render(); renderPattern();
</script>
</body>
</html>
